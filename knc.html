<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Pelaksana KNC</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .menu-container {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #059669; /* KNC Green Border */
        }
        .menu-title {
            color: #f8fafc;
            margin-top: 0;
            margin-bottom: 2rem;
            font-size: 1.5rem;
            border-bottom: 2px solid #059669;
            padding-bottom: 1rem;
            font-weight: 700;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            width: 100%;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            box-sizing: border-box;
        }
        .menu-btn:hover {
            background: linear-gradient(135deg, #059669, #047857);
            border-color: #059669;
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .menu-btn i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
            color: #34d399;
        }
        .menu-btn:hover i {
            color: white;
        }
        .back-btn {
            display: inline-block;
            margin-top: 1rem;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <h1 class="menu-title"><i class="fas fa-city"></i> Pelaksana KNC</h1>
        
        <a href="dashboard.html?project=KNC&role=user1" class="menu-btn">
            <i class="fas fa-hard-hat"></i> Pelaksana 1
        </a>
        
        <a href="dashboard.html?project=KNC&role=user2" class="menu-btn">
            <i class="fas fa-hard-hat"></i> Pelaksana 2
        </a>
        
        <a href="dashboard.html?project=KNC&role=user3" class="menu-btn">
            <i class="fas fa-hard-hat"></i> Pelaksana 3
        </a>

        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Kembali ke Menu Utama
        </a>
    </div>
</body>
</html>
